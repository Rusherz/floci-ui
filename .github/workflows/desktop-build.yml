name: Desktop Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux desktop bundles
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Linux deps for Tauri
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zsync

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build deb/rpm
        run: npm run desktop:build:linux

      - name: Build AppImage
        run: npm run desktop:build:appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-bundles
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  windows-x64:
    name: Windows x64 build
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (Windows)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 bundle
        run: npm run desktop:build:windows:x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-bundles
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
