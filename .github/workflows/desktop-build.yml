name: Desktop Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux desktop bundles
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify Linux deps for Tauri
        run: |
          missing=()

          command -v patchelf >/dev/null 2>&1 || missing+=("patchelf")
          command -v zsync >/dev/null 2>&1 || missing+=("zsync")
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || missing+=("libwebkit2gtk-4.1-dev")
          dpkg -s libgtk-3-dev >/dev/null 2>&1 || missing+=("libgtk-3-dev")
          dpkg -s libayatana-appindicator3-dev >/dev/null 2>&1 || missing+=("libayatana-appindicator3-dev")
          dpkg -s librsvg2-dev >/dev/null 2>&1 || missing+=("librsvg2-dev")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required system dependencies on Linux runner:" >&2
            printf ' - %s\n' "${missing[@]}" >&2
            echo "Install them on the self-hosted runner host (or configure passwordless sudo and add an install step)." >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Clean Tauri bundle staging
        run: |
          rm -rf desktop/src-tauri/target/release/resources/next
          rm -rf desktop/src-tauri/target/release/bundle/appimage_deb
          rm -rf desktop/src-tauri/target/release/bundle/appimage
          rm -rf desktop/src-tauri/target/release/bundle/deb
          rm -rf desktop/src-tauri/target/release/bundle/rpm

      - name: Debug staged native modules before AppImage
        run: |
          echo "## Debug: staged native modules before AppImage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -d desktop/src-tauri/target/release/resources/next ]; then
            find desktop/src-tauri/target/release/resources/next -type f | rg -n "musl|sharp-linux|sharp-libvips|\\.node$" || true
          else
            echo "resources/next not present yet"
          fi
          if [ -d desktop/src-tauri/target/release/bundle/appimage_deb ]; then
            find desktop/src-tauri/target/release/bundle/appimage_deb -type f | rg -n "musl|sharp-linux|sharp-libvips|\\.node$" || true
          else
            echo "bundle/appimage_deb not present yet"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run desktop:build:appimage

      - name: Build deb/rpm
        run: npm run desktop:build:linux

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Linux rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-rpm
          path: desktop/src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-appimage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Add Linux package list to run summary
        if: success()
        run: |
          echo "## Linux desktop bundles" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh \
            desktop/src-tauri/target/release/bundle/deb/*.deb \
            desktop/src-tauri/target/release/bundle/rpm/*.rpm \
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows-x64:
    name: Windows x64 build
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (Windows)
        shell: powershell
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Windows x64 bundle
        run: npm run desktop:build:windows:x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-bundles
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**

      - name: Add Windows package list to run summary
        if: success()
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows x64 desktop bundles"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Get-ChildItem -Path "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -File |
            Select-Object Length, FullName |
            Format-Table -AutoSize | Out-String -Width 4096 |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
