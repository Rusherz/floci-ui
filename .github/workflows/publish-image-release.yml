name: Publish Image - Release Distribution

on:
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string
      version_image:
        required: true
        type: string
      latest_image:
        required: true
        type: string
      latest_rc_image:
        required: true
        type: string
      manifest_url:
        required: true
        type: string
      update_changes:
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  publish_desktop_release:
    name: Publish desktop release assets
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Download Linux deb artifact
        uses: actions/download-artifact@v5
        with:
          name: desktop-linux-deb
          path: desktop-release-assets

      - name: Download Linux rpm artifact
        uses: actions/download-artifact@v5
        with:
          name: desktop-linux-rpm
          path: desktop-release-assets

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v5
        with:
          name: desktop-linux-appimage
          path: desktop-release-assets

      - name: Download Windows MSI artifact
        uses: actions/download-artifact@v5
        with:
          name: desktop-windows-x64-msi
          path: desktop-release-assets

      - name: Download Windows NSIS artifact
        uses: actions/download-artifact@v5
        with:
          name: desktop-windows-x64-nsis
          path: desktop-release-assets

      - name: Publish release and upload desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            RELEASE_TAG="desktop-v${{ inputs.version_tag }}"
            RELEASE_TITLE="Desktop v${{ inputs.version_tag }}"
            PRERELEASE_FLAG=""
            CHANNEL_NOTE="stable"
          else
            RELEASE_TAG="desktop-v${{ inputs.version_tag }}-rc"
            RELEASE_TITLE="Desktop v${{ inputs.version_tag }} (RC)"
            PRERELEASE_FLAG="--prerelease"
            CHANNEL_NOTE="rc"
          fi

          mapfile -t RAW_ASSET_FILES < <(find desktop-release-assets -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.msi" -o -name "*.exe" \) | sort)
          if [[ ${#RAW_ASSET_FILES[@]} -eq 0 ]]; then
            echo "No desktop release assets found." >&2
            exit 1
          fi

          ZIP_DIR="desktop-release-zips"
          mkdir -p "$ZIP_DIR"
          ZIP_ASSET_FILES=()
          for asset in "${RAW_ASSET_FILES[@]}"; do
            base_name="$(basename "$asset")"
            zip_path="$ZIP_DIR/${base_name}.zip"
            rm -f "$zip_path"
            zip -j "$zip_path" "$asset"
            ZIP_ASSET_FILES+=("$zip_path")
          done

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          Desktop bundles for Floci UI.

          - Version: ${{ inputs.version_tag }}
          - Channel: $CHANNEL_NOTE
          - Commit: ${{ github.sha }}
          - Source run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ZIP_ASSET_FILES[@]}" --clobber --repo "${{ github.repository }}"
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --repo "${{ github.repository }}" $PRERELEASE_FLAG
          else
            gh release create "$RELEASE_TAG" "${ZIP_ASSET_FILES[@]}" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE" --target "${{ github.sha }}" --repo "${{ github.repository }}" $PRERELEASE_FLAG
          fi

          {
            echo "## Published desktop release assets"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- URL: \`https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG\`"
            echo "- Zip files:"
            for asset in "${ZIP_ASSET_FILES[@]}"; do
              echo "  - \`$(basename "$asset")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  publish_pages_version:
    name: Publish Pages version.json
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 200

      - name: Create Pages artifact
        shell: bash
        run: |
          mkdir -p pages
          BUILT_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          BASE_URL='${{ vars.PAGES_BASE_URL }}'
          BASE_URL="${BASE_URL%/}"
          MAIN_URL="$BASE_URL/version.json"
          DEV_URL="$BASE_URL/dev/version.json"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            CURRENT_URL="$MAIN_URL"
          else
            CURRENT_URL="$DEV_URL"
          fi
          RAW_CHANGES='${{ inputs.update_changes }}'
          MANUAL_CHANGES_JSON="$(node -e "
            const raw = process.argv[1] || '';
            const changes = raw.split(/\\r?\\n/).map((s) => s.trim()).filter(Boolean);
            process.stdout.write(JSON.stringify(changes));
          " "$RAW_CHANGES")"

          PREV_COMMIT=''
          CURRENT_TMP="$(mktemp)"
          if curl -fsS "$CURRENT_URL" -o "$CURRENT_TMP"; then
            PREV_COMMIT="$(node -e "
              try {
                const json = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
                process.stdout.write(String(json.commit || '').trim());
              } catch {
                process.stdout.write('');
              }
            " "$CURRENT_TMP")"
          fi
          rm -f "$CURRENT_TMP"

          if [[ -n "$RAW_CHANGES" ]]; then
            CHANGES_JSON="$MANUAL_CHANGES_JSON"
          else
            LOG_RANGE=''
            if [[ -n "$PREV_COMMIT" ]] && git cat-file -e "${PREV_COMMIT}^{commit}" >/dev/null 2>&1; then
              LOG_RANGE="${PREV_COMMIT}..${{ github.sha }}"
            else
              LOG_RANGE="-20"
            fi

            if [[ "$LOG_RANGE" == "-20" ]]; then
              COMMIT_SUBJECTS="$(git log --no-merges --format=%s -n 20)"
            else
              COMMIT_SUBJECTS="$(git log --no-merges --format=%s "$LOG_RANGE")"
            fi

            CHANGES_JSON="$(node -e "
              const raw = process.argv[1] || '';
              const lines = raw.split(/\\r?\\n/).map((s) => s.trim()).filter(Boolean);
              const explicit = [];
              for (const line of lines) {
                const m = line.match(/^changelog:\\s*(.+)$/i);
                if (m && m[1]) explicit.push(m[1].trim());
              }
              const conventional = [];
              for (const line of lines) {
                const m = line.match(/^(feat|fix)(\\([^)]*\\))?:\\s+(.+)$/i);
                if (m && m[3]) conventional.push(m[3].trim());
              }
              const picked = explicit.length ? explicit : conventional;
              const unique = [];
              const seen = new Set();
              for (const item of picked) {
                if (!item || seen.has(item)) continue;
                seen.add(item);
                unique.push(item);
                if (unique.length >= 12) break;
              }
              if (!unique.length && lines[0]) {
                const latest = lines[0];
                const skipFallback = /^(ci|chore|docs|test|build|style|refactor)(\\([^)]*\\))?:/i.test(latest);
                if (!skipFallback) {
                  unique.push(latest);
                }
              }
              process.stdout.write(JSON.stringify(unique));
            " "$COMMIT_SUBJECTS")"
          fi

          mkdir -p pages/dev

          write_manifest() {
            local path="$1"
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              cat > "$path" <<EOF
          {
            "version": "${{ inputs.version_tag }}",
            "versionImage": "${{ inputs.version_image }}",
            "latestImage": "${{ inputs.latest_image }}",
            "changes": $CHANGES_JSON,
            "commit": "${{ github.sha }}",
            "builtAt": "$BUILT_AT",
            "ref": "${{ github.ref }}"
          }
          EOF
            else
              cat > "$path" <<EOF
          {
            "version": "${{ inputs.version_tag }}",
            "versionImage": "${{ inputs.version_image }}",
            "latestRcImage": "${{ inputs.latest_rc_image }}",
            "changes": $CHANGES_JSON,
            "commit": "${{ github.sha }}",
            "builtAt": "$BUILT_AT",
            "ref": "${{ github.ref }}"
          }
          EOF
            fi
          }

          fetch_existing_json() {
            local url="$1"
            local path="$2"
            local tmp
            tmp="$(mktemp)"
            if curl -fsS "$url" -o "$tmp"; then
              if node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$tmp" >/dev/null 2>&1; then
                mv "$tmp" "$path"
                return 0
              fi
            fi
            rm -f "$tmp"
            return 1
          }

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            write_manifest "pages/version.json"
            fetch_existing_json "$DEV_URL" "pages/dev/version.json" || cat > pages/dev/version.json <<EOF
          {
            "version": null,
            "unavailable": true
          }
          EOF
          else
            write_manifest "pages/dev/version.json"
            fetch_existing_json "$MAIN_URL" "pages/version.json" || cat > pages/version.json <<EOF
          {
            "version": null,
            "unavailable": true
          }
          EOF
          fi
          touch pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: pages_deploy
        uses: actions/deploy-pages@v4

      - name: Publish Pages summary
        shell: bash
        run: |
          {
            echo "## Published GitHub Pages version files"
            echo "- Main URL: \`${{ vars.PAGES_BASE_URL }}/version.json\`"
            echo "- Dev URL: \`${{ vars.PAGES_BASE_URL }}/dev/version.json\`"
            echo "- Updated URL: \`${{ inputs.manifest_url }}\`"
            echo "- Version tag: \`${{ inputs.version_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote_channel:
    name: Promote channel tag
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote version image to release channel
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TARGET="${{ inputs.latest_image }}"
          else
            TARGET="${{ inputs.latest_rc_image }}"
          fi
          docker buildx imagetools create -t "$TARGET" "${{ inputs.version_image }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Verify promoted image manifest
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TARGET="${{ inputs.latest_image }}"
          else
            TARGET="${{ inputs.latest_rc_image }}"
          fi
          docker buildx imagetools inspect "$TARGET"
