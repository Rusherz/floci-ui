name: Publish Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'agents.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      update_changes:
        description: 'Optional newline-delimited feature changes to publish in version.json'
        required: false
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  build_pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/publish-image-build.yml
    secrets: inherit

  desktop_build:
    name: Desktop Build
    needs: [build_pipeline]
    if: needs.build_pipeline.result == 'success'
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit

  release_distribution:
    name: Release Distribution
    needs: [build_pipeline]
    if: needs.build_pipeline.result == 'success'
    uses: ./.github/workflows/publish-image-release.yml
    with:
      version_tag: ${{ needs.build_pipeline.outputs.version_tag }}
      version_image: ${{ needs.build_pipeline.outputs.version_image }}
      latest_image: ${{ needs.build_pipeline.outputs.latest_image }}
      latest_rc_image: ${{ needs.build_pipeline.outputs.latest_rc_image }}
      manifest_url: ${{ needs.build_pipeline.outputs.manifest_url }}
      update_changes: ${{ github.event.inputs.update_changes || '' }}
    secrets: inherit

  publish_summary:
    name: Publish summary
    needs: [build_pipeline, release_distribution]
    if: always() && needs.build_pipeline.result == 'success' && (needs.release_distribution.result == 'success' || needs.release_distribution.result == 'skipped')
    uses: ./.github/workflows/publish-image-summary.yml
    with:
      version_image: ${{ needs.build_pipeline.outputs.version_image }}
      amd64_arch_image: ${{ needs.build_pipeline.outputs.amd64_arch_image }}
      arm64_arch_image: ${{ needs.build_pipeline.outputs.arm64_arch_image }}
      latest_image: ${{ needs.build_pipeline.outputs.latest_image }}
      latest_rc_image: ${{ needs.build_pipeline.outputs.latest_rc_image }}
    secrets: inherit
