name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Start Floci
        run: |
          docker rm -f floci-e2e >/dev/null 2>&1 || true
          docker run -d --name floci-e2e -p 4566:4566 hectorvent/floci:latest
          for i in {1..60}; do
            if curl -sf http://localhost:4566/ >/dev/null; then
              echo "Floci is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Floci did not become ready in time"
          docker logs floci-e2e || true
          exit 1

      - name: Run lint + Playwright e2e
        env:
          RUN_FLOCI_E2E: '1'
          NEXT_PUBLIC_FLOCI_ENABLED_SERVICES: '*'
        run: |
          npm run lint
          npm run test:e2e

      - name: Stop Floci
        if: always()
        run: |
          docker logs floci-e2e || true
          docker rm -f floci-e2e || true

      - name: Execute GitVersion (Docker)
        id: gitversion
        shell: bash
        run: |
          FULL_SEMVER="$(docker run --rm -v "$PWD:/repo" gittools/gitversion:6.0.5-alpine.3.20-6.0 /repo /showvariable FullSemVer)"
          echo "fullSemVer=$FULL_SEMVER" >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          IMAGE_REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=$IMAGE_REPO_LC" >> "$GITHUB_OUTPUT"

      - name: Derive Docker tag from fullSemVer
        id: version
        shell: bash
        run: |
          SEMVER='${{ steps.gitversion.outputs.fullSemVer }}'
          # Docker tags do not allow '+'
          SEMVER_SAFE="${SEMVER//+/.}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "semver_safe=$SEMVER_SAFE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}:${{ steps.version.outputs.semver_safe }}

      - name: Tag and push latest (default branch only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.repo }}"
          VERSION_TAG='${{ steps.version.outputs.semver_safe }}'
          docker pull "$IMAGE:$VERSION_TAG"
          docker tag "$IMAGE:$VERSION_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
