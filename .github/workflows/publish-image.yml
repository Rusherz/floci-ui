name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.0.x'

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Derive Docker tag from fullSemVer
        id: version
        shell: bash
        run: |
          SEMVER='${{ steps.gitversion.outputs.fullSemVer }}'
          # Docker tags do not allow '+'
          SEMVER_SAFE="${SEMVER//+/.}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "semver_safe=$SEMVER_SAFE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push semver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.semver_safe }}

      - name: Tag and push latest (default branch only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          VERSION_TAG='${{ steps.version.outputs.semver_safe }}'
          docker pull "$IMAGE:$VERSION_TAG"
          docker tag "$IMAGE:$VERSION_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
