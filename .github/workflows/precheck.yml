name: Precheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  precheck:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run precheck
        env:
          NEXT_PUBLIC_FLOCI_ENABLED_SERVICES: '*'
        run: npm run precheck
