<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floci - SQS/S3 Navigator</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Floci</h1>
        <nav class="nav">
          <button class="nav-btn active" data-view="sqs">SQS</button>
          <button class="nav-btn" data-view="s3">S3</button>
        </nav>
        <div class="sidebar-footer">
          <button id="theme-toggle-btn" class="theme-btn" type="button">Dark Mode</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h2 id="view-title">SQS Explorer</h2>
          <div class="topbar-actions">
            <input id="search-input" type="search" placeholder="Search..." />
            <button id="refresh-btn" class="refresh-btn" type="button">Refresh</button>
          </div>
        </header>
        <p id="status-banner" class="status-banner hidden"></p>

        <section id="sqs-view" class="panel-grid">
          <section class="panel">
            <h3>Queues</h3>
            <ul id="queue-list" class="list"></ul>
          </section>

          <section class="panel">
            <div class="panel-title-row">
              <h3>Messages</h3>
              <button id="poll-toggle-btn" class="path-btn" type="button">Pause</button>
            </div>
            <div class="poll-progress" aria-label="SQS polling progress">
              <div id="poll-progress-fill" class="poll-progress-fill"></div>
            </div>
            <ul id="message-list" class="list"></ul>
          </section>

          <section class="panel detail-panel">
            <div class="panel-title-row">
              <h3>Message Detail</h3>
              <button id="delete-message-btn" class="path-btn danger" type="button" disabled>Delete</button>
            </div>
            <pre id="message-detail" class="detail">Select a message.</pre>
          </section>
        </section>

        <section id="s3-view" class="panel-grid hidden">
          <section class="panel">
            <h3>Buckets</h3>
            <ul id="bucket-list" class="list"></ul>
          </section>

          <section class="panel">
            <h3>Objects</h3>
            <div class="s3-pathbar">
              <button id="object-up-btn" class="path-btn" type="button">Up</button>
              <div id="object-path" class="object-path"></div>
            </div>
            <ul id="object-list" class="list"></ul>
          </section>

          <section class="panel detail-panel">
            <h3>Object Preview</h3>
            <div class="object-actions">
              <button id="open-object-btn" class="path-btn" type="button" disabled>Open</button>
              <button id="delete-object-btn" class="path-btn danger" type="button" disabled>Delete</button>
            </div>
            <pre id="object-detail" class="detail">Select an object.</pre>
          </section>
        </section>
      </main>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <h3 id="confirm-modal-title">Confirm</h3>
        <p id="confirm-modal-message" class="modal-message"></p>
        <div class="modal-actions">
          <button id="confirm-modal-cancel" class="path-btn" type="button">Cancel</button>
          <button id="confirm-modal-confirm" class="path-btn danger" type="button">Confirm</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
